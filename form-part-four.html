<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
</head>
<body>
    <div>
        <h1>Book Store</h1>
        <p>This Is My Book Store , Welcome</p>
    </div>
    <hr>
    <form action="" method="post">
        <div>
            <input type="hidden" value="Aziz">
            <label>Username</label>
            <input type="text" required placeholder="Username" name="user">
        </div>
        <br>
        <div>
            <label>Password</label>
            <input name="pass" type="password" required placeholder="Write A Complex Password">
        </div>
        <br>
        <div>
            <label>Subject</label>
            <input type="text" name="sub">
        </div>
        <br>
        <div>
            <label>Email</label>
            <input type="email" placeholder="Write A Vaild Email" value="o@nn.sa" name="mail">
        </div>
        <div>
            <label>Range</label>
            <input type="range" name="range">
        </div>
        <br>
        <div>
            <label>Number</label>
            <input type="number" name="number">
        </div>
        <br>
        <input type="color" name="Color">
        <br>
        <input type="reset" value="Reset">
        <input type="submit" value="Save">
    </form>
</body>
</html>
