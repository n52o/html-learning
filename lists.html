<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
</head>
<body>
    <h1>Book Store</h1>
    <p>This Is My <b>Book Store</b>, Welcome</p>

    <!-- 
    ul ==> Unorderd List
    li ==> List Items
    ol ==> Ordered List
    dl ==> Description List
    dt ==> Term (Title)
    dd ==> Description Of The Term
    -->

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>
            JS
            <ul>
                <li>VueJs</li>
                <li>React</li>
            </ul>
        </li>
    </ul>

    <hr>
        <ol>
        <li>Name</li>
        <li>Address</li>
        <li>Id</li>
    </ol>
    <!-- Some Prive Attributes On Ordered List : -->
    <!-- 
    reversed ==> Reverse The Ordering
    start ==> Start From 
    type ==> Type Of Ordering
    -->
    <hr>
    <ol reversed>
        <li>Name</li>
        <li>Address</li>
        <li>Id</li>
    </ol>
    <hr>
        <ol start = "100">
        <li>Name</li>
        <li>Address</li>
        <li>Id</li>
    </ol>
    <hr>
        <ol type="A">
        <li>Name</li>
        <li>Address</li>
        <li>Id</li>
    </ol>
    <hr>
    <dl>
        <dt>HTML</dt>
        <dd>Language Of The Web</dd>

        <dt>CSS</dt>
        <dd>Language Of The Visuals</dd>
    </dl>
</body>
</html>
